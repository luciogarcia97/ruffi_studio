# Solo desarrollo local. Las claves son de prueba y el puerto no se expone a la red.
name: ruffi
services:
  mysql:
    image: mysql:8.4
    container_name: ruffi_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ruffi_root_dev
      MYSQL_DATABASE: ruffi
      MYSQL_USER: ruffi
      MYSQL_PASSWORD: ruffi_dev
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    ports: ["127.0.0.1:3316:3306"]
    volumes: ["ruffi_mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -uruffi -pruffi_dev -e 'select 1' ruffi"]
      interval: 5s
      retries: 30
volumes:
  ruffi_mysql_data:
